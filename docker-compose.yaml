# Stack unificado de bases del Fixture 2030.
# Ejecutar desde este directorio: docker compose up -d
# Conserva los puertos, directorios persistentes y datos de los Compose por módulo.
name: fixture2030

services:
  mongo:
    image: mongo:7.0
    container_name: fixture2030-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    volumes:
      - fixture2030_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: fixture2030-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command:
      - redis-server
      # Sin persistencia: la caché se reconstruye desde MongoDB e InfluxDB.
      - --save
      - ""
      - --maxmemory
      - 256mb
      # Instancia dedicada a caché reconstruible: desaloja las claves menos usadas, tengan o no TTL.
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  influxdb:
    image: influxdb:3-core
    container_name: fixture2030-influxdb
    restart: unless-stopped
    depends_on:
      influxdb-token-init:
        condition: service_completed_successfully
    environment:
      INFLUXDB3_NODE_ID: node1
      INFLUXDB3_OBJECT_STORE: file
      INFLUXDB3_DATA_DIR: /var/lib/influxdb3
      INFLUXDB3_ADMIN_TOKEN_FILE: /var/lib/influxdb3/admin_token.json
      INFLUXDB3_QUERY_FILE_LIMIT: "50000"
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - ${HOME}/docker/data/influxdb:/var/lib/influxdb3
      - ../idd-2-tp/fixture2030-influxdb/scripts:/scripts:ro

  influxdb-token-init:
    image: influxdb:3-core
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "if [ ! -s /var/lib/influxdb3/admin_token.json ]; then influxdb3 create token --admin --offline --output-file /var/lib/influxdb3/admin_token.json >/dev/null; fi"
    volumes:
      - ${HOME}/docker/data/influxdb:/var/lib/influxdb3

volumes:
  fixture2030_data:
    name: fixture2030_fixture2030_data
  redis_data:
    external: true
    name: fixture2030-redis_redis_data
