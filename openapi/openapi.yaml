  /sedes/{codigo}/goleadores:
    get:
      tags:
      - Partidos y eventos
      summary: Goles de jugadores de una confederación en una sede
      description: Recorre sede, partidos, goles, autores y equipos. Sin goles devuelve
        200 con lista vacía.
      operationId: listar_goleadores_sedes__codigo__goleadores_get
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          pattern: ^S-[0-9]{2}$
          description: Código de la sede
          examples:
          - S-04
          title: Codigo
        description: Código de la sede
      - name: confederacion
        in: query
        required: true
        schema:
          enum:
          - UEFA
          - CONMEBOL
          - CAF
          - AFC
          - CONCACAF
          - OFC
          type: string
          description: Confederación del equipo del goleador
          title: Confederacion
        description: Confederación del equipo del goleador
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Máximo de goles a devolver
          default: 50
          title: Limit
        description: Máximo de goles a devolver
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoleadoresResponse'
          headers:
            X-Request-Id:
