          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '400':
          description: Parámetro inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '503':
          description: Dependencia no disponible, identidad rechazada, permisos o
