  /partidos/{codigo}/mapa-calor:
    get:
      tags:
      - Mapa de calor
      summary: Mapa de calor de un jugador en un partido
      description: 'Muestras de posición por celda de 5 × 5 m (cancha de 105 × 68
        m, 21 × 14 celdas), contadas en InfluxDB, con intensidad relativa a la celda
        más ocupada; las celdas sin muestras se omiten. Los minutos se cuentan desde
        el inicio del tracking del partido, con inicio inclusivo y fin exclusivo,
        entre 0 y 120. Sin `desde_minuto` empieza en 0; sin `hasta_minuto`, llega
        al minuto transcurrido del reloj (120 si no hay reloj). En vivo lee el tracking
        crudo (`fuente: en_vivo`); finalizado, la ocupación materializada por minuto
        (`fuente: historico`), o el crudo si todavía no se materializó. Sin datos
        de tracking, incluida una tabla o base de tracking aún no creada, devuelve
        200 con `celdas` vacía; los fallos de autenticación, permisos, conexión y
        consulta se siguen informando. Partido próximo: 200 con `celdas` vacía, `fuente`
        e `intervalo` null. Se cachea en Redis 5 s en vivo y 1 h en histórico. Partido
        inexistente o jugador ajeno a sus selecciones: 404.'
      operationId: obtener_mapa_calor_partidos__codigo__mapa_calor_get
      parameters:
      - name: codigo
        in: path
