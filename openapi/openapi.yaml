openapi: 3.1.0
info:
  title: Fixture 2030 API
  description: API REST integrada del Fixture Mundial 2030 (Hito 10).
  version: 1.0.0
servers:
- url: http://localhost:8000
  description: Local
paths:
  /health:
    get:
      tags:
      - Sistema
      summary: Estado de las dependencias
      description: 'Consulta en paralelo MongoDB, Redis e InfluxDB. Responde 200 aunque
        una fuente esté caída: la marca como `down`. Reusa el último ping de cada
        fuente durante 15 s: el estado puede tener hasta 15 s de atraso.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
  /live:
    get:
      tags:
      - Sistema
      summary: Proceso de la API activo
      description: No consulta dependencias ni verifica datos de dominio.
      operationId: live_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
  /ready:
    get:
      tags:
      - Sistema
      summary: Readiness de conectividad
      description: '200 si pasa el ping de MongoDB; 503 si falla. Redis es caché opcional
        y no se evalúa. InfluxDB tampoco: si cae, solo las rutas que lo usan responden
        503 `INFLUXDB_UNAVAILABLE` y su estado se informa en `/health`. Reusa el último
        ping de cada fuente durante 15 s: el estado puede tener hasta 15 s de atraso.
        No certifica datos de dominio.'
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '503':
          description: MongoDB no está disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
  /fixture:
    get:
      tags:
      - Fixture
      summary: Consultar el fixture
      description: Mundial 2030 completo, ordenado por fecha y código. Horarios UTC.
        Sin partidos devuelve items vacío. Redis es opcional; caché de 5 s por defecto.
      operationId: obtener_fixture_fixture_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixtureResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '503':
          description: Dependencia no disponible, identidad rechazada, permisos o
            contexto incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '504':
          description: Timeout de dependencia (<FUENTE>_TIMEOUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
  /grupos:
    get:
      tags:
      - Grupos
      summary: Consultar los grupos
      description: 'Participantes y reglas de la demo desde MongoDB. Sin datos: items
        vacío.'
      operationId: obtener_grupos_grupos_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GruposResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '400':
          description: Parámetro inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '503':
          description: Dependencia no disponible, identidad rechazada, permisos o
            contexto incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '504':
          description: Timeout de dependencia (<FUENTE>_TIMEOUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
  /grupos/{id}/posiciones:
    get:
      tags:
      - Grupos
      summary: Consultar posiciones y partidos de un grupo
      description: 'Solo cuentan resultados finalizados, sin goles de tanda. Orden:
        puntos, diferencia de gol, goles a favor y orden del dataset. Redis opcional,
        versionado por reglas y partidos para reflejar cierres y correcciones. completa
        indica que terminaron todos los cruces esperados.'
      operationId: obtener_posiciones_grupos__id__posiciones_get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-P]$
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosicionesResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '400':
          description: Parámetro inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '404':
          description: Recurso inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '503':
          description: Dependencia no disponible, identidad rechazada, permisos o
            contexto incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '504':
          description: Timeout de dependencia (<FUENTE>_TIMEOUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
  /playoffs:
    get:
      tags:
      - Playoffs
      summary: Consultar el cuadro de eliminatorias
      description: 'Cruces ordenados por ronda y orden visual desde MongoDB. Plazas
        por equipo, puesto de grupo completo o ganador anterior. Incluye partido,
        origen, ganador y siguiente cruce. Redis opcional versionado por todas las
        entradas: cierres y correcciones recalculan sin escrituras. Un resultado con
        participantes obsoletos o sin desempate válido requiere_revision y no propaga
        ganador. Sin cuadro cargado devuelve items vacío. Reglas explícitas de la
        demo: dos clasificados por grupo, sin mejores terceros.'
      operationId: obtener_playoffs_playoffs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayoffsResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '400':
          description: Parámetro inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '503':
          description: Dependencia no disponible, identidad rechazada, permisos o
            contexto incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '504':
          description: Timeout de dependencia (<FUENTE>_TIMEOUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
  /equipos:
    get:
      tags:
      - Equipos y jugadores
      summary: Catálogo de equipos
      description: Todos los equipos de MongoDB, ordenados por nombre y código. Sin
        filtros ni paginación; vacío permitido.
      operationId: listar_equipos_equipos_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquiposResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '400':
          description: Parámetro inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '503':
          description: Dependencia no disponible, identidad rechazada, permisos o
            contexto incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '504':
          description: Timeout de dependencia (<FUENTE>_TIMEOUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
  /equipos/{codigo}:
    get:
      tags:
      - Equipos y jugadores
      summary: Ficha de un equipo
      operationId: obtener_equipo_equipos__codigo__get
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{3}$
          description: Código FIFA del equipo
          examples:
          - ARG
          title: Codigo
        description: Código FIFA del equipo
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipoResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '400':
          description: Parámetro inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '404':
          description: Recurso inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '503':
          description: Dependencia no disponible, identidad rechazada, permisos o
            contexto incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '504':
          description: Timeout de dependencia (<FUENTE>_TIMEOUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
  /jugadores:
    get:
      tags:
      - Equipos y jugadores
      summary: Plantel de un equipo
      description: Ordenado por dorsal. Un filtro sin resultados devuelve 200 con
        lista vacía.
      operationId: listar_jugadores_jugadores_get
      parameters:
      - name: equipo
        in: query
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{3}$
          description: Código FIFA del equipo
          examples:
          - ARG
          title: Equipo
        description: Código FIFA del equipo
      - name: posicion
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - Arquero
            - Defensor
            - Mediocampista
            - Delantero
            type: string
          - type: 'null'
          title: Posicion
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Máximo de elementos por página
          default: 20
          title: Limit
        description: Máximo de elementos por página
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 0
          description: Elementos a saltear
          default: 0
          title: Skip
        description: Elementos a saltear
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JugadoresPagina'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '400':
          description: Parámetro inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '503':
          description: Dependencia no disponible, identidad rechazada, permisos o
            contexto incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '504':
          description: Timeout de dependencia (<FUENTE>_TIMEOUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
  /jugadores/{codigo}:
    get:
      tags:
      - Equipos y jugadores
      summary: Ficha de un jugador
      operationId: obtener_jugador_jugadores__codigo__get
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{3}-([1-9]|[1-9][0-9])$
          description: '`<equipo>-<dorsal>`'
          examples:
          - ARG-10
          title: Codigo
        description: '`<equipo>-<dorsal>`'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JugadorDetalle'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '400':
          description: Parámetro inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '404':
          description: Recurso inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '503':
          description: Dependencia no disponible, identidad rechazada, permisos o
            contexto incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '504':
          description: Timeout de dependencia (<FUENTE>_TIMEOUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
  /partidos/{codigo}:
    get:
      tags:
      - Partidos y eventos
      summary: Ficha de un partido
      description: Detalle desde MongoDB con sede, fecha/hora UTC, estado, resultado
        y reloj persistido (puede ser null si aún no fue informado). Tanda separada
        de goles de juego. Plazas de playoffs resueltas como en el cuadro; requiere_revision
        identifica resultados obsoletos o no decisivos. Redis opcional con claves
        versionadas por las entradas actuales y TTL corto. fecha se conserva como
        fecha UTC por compatibilidad.
      operationId: obtener_partido_partidos__codigo__get
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          pattern: ^P-[0-9]{3}$
          description: Código del partido
          examples:
          - P-001
          title: Codigo
        description: Código del partido
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartidoResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '400':
          description: Parámetro inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '404':
          description: Recurso inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '503':
          description: Dependencia no disponible, identidad rechazada, permisos o
            contexto incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '504':
          description: Timeout de dependencia (<FUENTE>_TIMEOUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
  /partidos/{codigo}/eventos:
    get:
      tags:
      - Partidos y eventos
      summary: Eventos de un partido con sus protagonistas
      description: 'Cronología desde MongoDB con Redis opcional versionado. Orden
        por minuto, adicional y código; paginación limit/skip con total y siguiente_skip.
        Incluye equipo, protagonistas y una instantánea consistente del estado, resultado
        y reloj. Sin eventos: 200 vacío; partido inexistente: 404. No incluye tandas.
        Plazas obsoletas no heredan eventos.'
      operationId: listar_eventos_partidos__codigo__eventos_get
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          pattern: ^P-[0-9]{3}$
          description: Código del partido
          examples:
          - P-001
          title: Codigo
        description: Código del partido
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Máximo de eventos a devolver
          default: 50
          title: Limit
        description: Máximo de eventos a devolver
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Eventos a omitir en orden cronológico
          default: 0
          title: Skip
        description: Eventos a omitir en orden cronológico
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventosResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '500':
          description: Eventos persistidos inválidos; requieren revisión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '400':
          description: Parámetro inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '404':
          description: Recurso inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '503':
          description: Dependencia no disponible, identidad rechazada, permisos o
            contexto incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '504':
          description: Timeout de dependencia (<FUENTE>_TIMEOUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
