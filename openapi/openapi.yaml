  /partidos/{codigo}/eventos:
    get:
      tags:
      - Partidos y eventos
      summary: Eventos de un partido con sus protagonistas
      description: Ordenados por minuto. Un partido sin eventos devuelve 200 con lista
        vacía.
      operationId: listar_eventos_partidos__codigo__eventos_get
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          pattern: ^P-[0-9]{3}$
          description: Código del partido
          examples:
          - P-001
          title: Codigo
        description: Código del partido
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Máximo de eventos a devolver
          default: 50
          title: Limit
        description: Máximo de eventos a devolver
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
