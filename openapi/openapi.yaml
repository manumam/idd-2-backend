openapi: 3.1.0
info:
  title: Fixture 2030 API
  description: API REST integrada del Fixture Mundial 2030 (Hito 10).
  version: 1.0.0
servers:
- url: http://localhost:8000
  description: Local
paths:
  /health:
    get:
      tags:
      - Sistema
      summary: Estado de las dependencias
      description: 'Responde 200 aunque una fuente esté caída: la marca como `down`.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
  /live:
    get:
      tags:
      - Sistema
      summary: Proceso de la API activo
      description: No consulta dependencias ni verifica datos de dominio.
      operationId: live_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
  /ready:
    get:
      tags:
      - Sistema
      summary: Readiness de conectividad
      description: 200 si pasan los pings de las cuatro dependencias requeridas; 503
        si alguna falla. No certifica datos de dominio.
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '503':
          description: Una o más dependencias no están disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
  /equipos/{codigo}:
    get:
      tags:
      - Equipos y jugadores
      summary: Ficha de un equipo
      operationId: obtener_equipo_equipos__codigo__get
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{3}$
          description: Código FIFA del equipo
          examples:
          - ARG
          title: Codigo
        description: Código FIFA del equipo
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipoResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '400':
          description: Parámetro inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '404':
          description: Recurso inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '503':
          description: Dependencia no disponible, identidad rechazada, permisos o
            contexto incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '504':
          description: Timeout de dependencia (<FUENTE>_TIMEOUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
  /jugadores:
    get:
      tags:
      - Equipos y jugadores
      summary: Plantel de un equipo
      description: Ordenado por dorsal. Un filtro sin resultados devuelve 200 con
        lista vacía.
      operationId: listar_jugadores_jugadores_get
      parameters:
      - name: equipo
        in: query
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{3}$
          description: Código FIFA del equipo
          examples:
          - ARG
          title: Equipo
        description: Código FIFA del equipo
      - name: posicion
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - Arquero
            - Defensor
            - Mediocampista
            - Delantero
            type: string
          - type: 'null'
          title: Posicion
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Máximo de elementos por página
          default: 20
          title: Limit
        description: Máximo de elementos por página
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 0
          description: Elementos a saltear
          default: 0
          title: Skip
        description: Elementos a saltear
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JugadoresPagina'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '400':
          description: Parámetro inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '503':
          description: Dependencia no disponible, identidad rechazada, permisos o
            contexto incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '504':
          description: Timeout de dependencia (<FUENTE>_TIMEOUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
  /jugadores/{codigo}:
    get:
      tags:
      - Equipos y jugadores
      summary: Ficha de un jugador
      operationId: obtener_jugador_jugadores__codigo__get
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{3}-([1-9]|[1-9][0-9])$
          description: '`<equipo>-<dorsal>`'
          examples:
          - ARG-10
          title: Codigo
        description: '`<equipo>-<dorsal>`'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JugadorDetalle'
