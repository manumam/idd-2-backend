        schema:
          anyOf:
          - type: integer
            maximum: 120
            minimum: 0
            description: Minuto desde el inicio del tracking del partido
          - type: 'null'
          title: Hasta Minuto
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapaCalorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '400':
