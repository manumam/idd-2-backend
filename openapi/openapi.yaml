  /sesiones/{sesionId}:
    get:
      tags:
      - Sesiones
      summary: Consultar una sesión
      description: No renueva la sesión. 404 si no existe o ya expiró.
      operationId: obtener_sesion_sesiones__sesionId__get
      parameters:
      - name: sesionId
        in: path
        required: true
        schema:
          type: string
          pattern: ^SES-[A-Z0-9]{1,32}$
          description: Identificador de la sesión
          examples:
          - SES-0001
          title: Sesionid
        description: Identificador de la sesión
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '500':
          description: Error interno
          content:
