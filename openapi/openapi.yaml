        '404':
          description: Recurso inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '503':
          description: Dependencia no disponible, identidad rechazada, permisos o
            contexto incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '504':
          description: Timeout de dependencia (<FUENTE>_TIMEOUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
    delete:
      tags:
      - Sesiones
      summary: Cerrar una sesión
      description: 'Idempotente: responde 204 aunque la sesión ya no exista.'
      operationId: cerrar_sesion_sesiones__sesionId__delete
      parameters:
      - name: sesionId
        in: path
        required: true
        schema:
          type: string
          pattern: ^SES-[A-Z0-9]{1,32}$
          description: Identificador de la sesión
          examples:
          - SES-0001
          title: Sesionid
        description: Identificador de la sesión
      responses:
        '204':
          description: Successful Response
          headers:
            X-Request-Id:
              description: Identificador de correlación
              schema:
                type: string
        '500':
          description: Error interno
