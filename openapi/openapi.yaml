  /partidos/{codigo}/estadisticas:
    get:
      tags:
      - Estadísticas
      summary: Comparación de equipos o serie temporal por intervalo
      description: Sin fechas devuelve la comparación de ambos equipos, provisional
        o final consolidada. Con desde y hasta devuelve la serie temporal histórica.
        equipo y ventana requieren ambas fechas. Puntos cada 5 segundos por equipo
        en [`desde`, `hasta`). Sin `ventana`, el intervalo máximo es de 30 minutos;
        con `ventana` (`1m` o `5m`) es de 2 horas y cada medida se agrega según su
        tipo (promedio de posesión, máximo de tiros, suma de pases). Un intervalo
        sin puntos o un partido sin datos devuelve 200 con lista vacía.
      operationId: obtener_estadisticas_partidos__codigo__estadisticas_get
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          pattern: ^P-[0-9]{3}$
          description: Código del partido
          examples:
          - P-001
