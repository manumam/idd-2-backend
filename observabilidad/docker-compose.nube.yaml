# Envío a Grafana Cloud: usa la config generada por generar_config.py (con remote_write).
services:
  prometheus:
    volumes:
      - ./generado/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./generado/grafana_cloud_password:/etc/prometheus/grafana_cloud_password:ro
      - prometheus_nube_data:/prometheus

volumes:
  prometheus_nube_data:
