# Modo demo: usa la config generada por generar_config_demo.py (con remote_write).
# Volumen propio para que los datos de prueba no se mezclen con los de la demo.
services:
  prometheus:
    volumes:
      - ./generado/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./generado/grafana_cloud_password:/etc/prometheus/grafana_cloud_password:ro
      - prometheus_demo_data:/prometheus

volumes:
  prometheus_demo_data:
