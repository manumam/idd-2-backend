name: fixture2030-hito11
services:
  mongo:
    image: mongo:7.0
    ports: ["127.0.0.1:37017:27017"]
    volumes: ["mongo_lab:/data/db"]
  neo4j:
    image: neo4j:5-community
    ports: ["127.0.0.1:37474:7474", "127.0.0.1:37687:7687"]
    environment:
      NEO4J_AUTH: none
    volumes: ["neo4j_lab:/data"]
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:36379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_lab:/data"]
  influxdb:
    image: influxdb:3-core
    ports: ["127.0.0.1:38181:8181"]
    command: ["influxdb3", "serve", "--node-id", "hito11", "--object-store", "file", "--data-dir", "/var/lib/influxdb3", "--without-auth"]
    volumes: ["influx_lab:/var/lib/influxdb3"]
volumes:
  mongo_lab:
  neo4j_lab:
  redis_lab:
  influx_lab:
